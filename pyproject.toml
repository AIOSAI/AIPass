[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aipass"
version = "2.7.22"
description = "A local multi-agent framework where your AI agents keep their memory, work together, and never ask you to re-explain context"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "AIPass", email = "aipass.system@gmail.com" },
]
keywords = ["ai", "agents", "routing", "discovery", "multi-agent", "orchestration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "rich>=13.0",
    "watchdog>=3.0",
    "requests>=2.34.2",
    "psutil>=5.9",
    "questionary>=2.0",
    "pathspec>=0.12",
]

[project.urls]
Homepage = "https://github.com/AIOSAI/AIPass"
Repository = "https://github.com/AIOSAI/AIPass"
"Bug Tracker" = "https://github.com/AIOSAI/AIPass/issues"

[project.optional-dependencies]
llm = [
    "openai>=1.0",
]
trinity = [
    "trinity-pattern>=1.0.0",
]
memory = [
    "numpy>=2.0",
    "chromadb>=1.0",
    "fastembed>=0.4",
]
telegram = [
    "telethon>=1.36",
]
drive = [
    "google-auth>=2.29",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.126",
]
bluesky = [
    "atproto>=0.0.69",
]
# Host API (FPLAN-0411) — the Stage 0 server for the BAUD phone face.
# Optional: @api guards these imports and fails with install instructions,
# so a machine that never serves the phone lane needs none of them.
host = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Multipart parsing for POST /v1/files/upload. FastAPI needs it to read a
    # form body at all, and raises at app-creation time when it is missing, so
    # the server guards the import and answers 503 with this hint rather than
    # failing to start.
    "python-multipart>=0.0.9",
]
seedgo = []
dev = [
    "pytest>=9.0.3",
    "pytest-cov",
    "pytest-timeout",
    "pytest-xdist",
    "ruff>=0.11",
    "coverage",
    "pyright",
    "Pygments>=2.20.0",
    # starlette's TestClient (the host-lane test suites) imports httpx at setup
    # but starlette does not declare it — it is an optional extra there. Every
    # green run before this line was riding a transitive install (chromadb →
    # httpx on the setup.sh lanes, a hand-installed copy in the local venv);
    # the ubuntu CI job installs only .[dev,host] and had neither, which is
    # exactly the env-inherited-test-deps species from 1b56b5ce. Declared here
    # because it is a test-time dependency, not a server runtime one.
    "httpx>=0.28",
]

[project.scripts]
drone = "aipass.drone.cli:main"
aipass = "aipass.aipass.apps.aipass:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aipass"]

[tool.hatch.build.targets.wheel.force-include]
".claude/hooks" = "aipass/_hooks"

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
# ".*" restores pytest's default dot-dir exclusion (dropped when this list was
# customized) so scaffolding dirs (.aipass, .trinity, .seedgo, ...) are never
# recursed for tests — prevents conftest module-name collisions like a bundled
# skill's .aipass/.../tests/conftest.py clashing with a branch's tests/conftest.py.
norecursedirs = ["templates", "*.egg-info", ".*", "__pycache__", "my-project"]

[tool.coverage.run]
source = ["src/aipass"]
omit = ["*/tests/*", "*/templates/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120
# ruff 0.16.0 started linting/formatting Python code blocks inside markdown.
# READMEs are prose with illustrative snippets — keep them out of scope.
# spawn's templates carry {{BRANCH}} placeholders in code positions — not valid
# Python until rendered at create time; the newborn they mint IS linted.
extend-exclude = ["*.md", "src/aipass/spawn/templates"]

[tool.ruff.lint]
# Pin the pre-ruff-0.16 default rule set: 0.16.0 expanded the defaults to many
# new families (UP/I/BLE/DTZ/SIM/...) = 6.6k instant errors. Adopting new
# families is a deliberate cleanup, not a version-bump side effect.
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

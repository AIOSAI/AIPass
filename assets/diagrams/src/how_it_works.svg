<g><text x="80.0" y="96.0" fill="#e6f3ff" font-size="32" text-anchor="start" font-weight="700" letter-spacing="1">HOW IT WORKS</text><text x="80.0" y="128.0" fill="#9cc6f5" font-size="19" text-anchor="start">one task's round trip: you ask one manager, the agent that owns the code replies</text><text x="800.0" y="870.0" fill="#7fb2e8" font-size="18" text-anchor="middle">every command goes through one bus   ·   every tool write passes the gates</text><text x="1520.0" y="870.0" fill="#4d7fb8" font-size="14" text-anchor="end" letter-spacing="2">AIPASS</text><rect x="79.8" y="499.8" width="48.5" height="25.9" rx="6" fill="#061630" opacity="0.85"/><text x="104.0" y="518.0" fill="#dbeeff" font-size="19" text-anchor="middle" font-weight="700">you</text><rect x="194.7" y="359.8" width="138.6" height="25.9" rx="6" fill="#061630" opacity="0.85"/><text x="264.0" y="378.0" fill="#dbeeff" font-size="19" text-anchor="middle" font-weight="700">terminal seat</text><rect x="198.7" y="639.8" width="130.6" height="26.0" rx="6" fill="#061630" opacity="0.85"/><text x="264.0" y="658.0" fill="#dbeeff" font-size="19" text-anchor="middle" font-weight="700">phone room</text><text x="500.0" y="425.6" fill="#ffffff" font-size="22" text-anchor="start" font-weight="700" letter-spacing="1">MANAGER AGENT</text><text x="500.0" y="454.0" fill="#bfe0ff" font-size="18" text-anchor="start">one per project,</text><text x="500.0" y="477.4" fill="#bfe0ff" font-size="18" text-anchor="start">the seat with its git</text><rect x="863.2" y="299.8" width="81.6" height="25.9" rx="6" fill="#061630" opacity="0.85"/><text x="904.0" y="318.0" fill="#dbeeff" font-size="19" text-anchor="middle" font-weight="700">ai_mail</text><text x="1100.0" y="425.6" fill="#ffffff" font-size="22" text-anchor="start" font-weight="700" letter-spacing="1">OWNING AGENT</text><text x="1100.0" y="454.0" fill="#bfe0ff" font-size="18" text-anchor="start">wakes in its own folder,</text><text x="1100.0" y="477.4" fill="#bfe0ff" font-size="18" 
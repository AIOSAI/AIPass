[pytest]
# Test discovery paths
testpaths = tests

# Test file patterns
python_files = test_*.py
python_functions = test_*
python_classes = Test*

# Command-line options (always applied)
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Test markers (for categorizing tests)
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Tests that take significant time
# real_logger is registered in tests/conftest.py, NOT here: this file is not read
# when CI runs the composed suite with -c pyproject.toml, and a marker declared
# in two places drifts. conftest.py is loaded in both universes.

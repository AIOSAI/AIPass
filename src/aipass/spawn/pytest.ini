[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# templates/ holds UNRENDERED template sources: tests/conftest.py there imports
# aipass.{{BRANCH}}..., which is a SyntaxError until placeholders are replaced.
# testpaths already scopes a bare `pytest` run to tests/, but `pytest
# src/aipass/spawn` from the repo root makes THIS file the config and would
# recurse into templates/ and abort collection. The repo-root pyproject.toml
# carries the same exclusion; this keeps the path-argument form working too.
norecursedirs = templates *.egg-info .* __pycache__

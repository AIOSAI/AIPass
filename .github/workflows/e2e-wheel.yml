name: e2e-wheel

# Cross-OS end-to-end WIRING test (FPLAN-0239, P1 of DPLAN-0194).
# Builds the wheel, installs it into a clean venv (handled by the pytest
# fixtures in tests/e2e/conftest.py), and runs the 4-tier wiring ladder.
#
# No Windows leg: CI runs Linux and macOS, Windows users run AIPass inside WSL2,
# and no runner proves the Windows paths. The retired Windows lane sits beside
# this file as windows-test.yml(windows_disabled), unread by Actions.

on:
  push:
    branches: [main, dev]
    paths:
      - "tests/e2e/**"
      - ".github/workflows/e2e-wheel.yml"
      - "pyproject.toml"
      - "src/**"
  pull_request:
    paths:
      - "tests/e2e/**"
      - ".github/workflows/e2e-wheel.yml"
      - "pyproject.toml"
      - "src/**"
  workflow_dispatch:

# Least-privilege token (Scorecard Token-Permissions). This workflow only
# reads the repo to build + smoke-test the wheel; it needs no write scopes.
permissions:
  contents: read

jobs:
  e2e-wheel:
    name: e2e-wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tooling
        # Hash-pinned (Scorecard: Pinned-Dependencies). e2e.txt carries colorama
        # explicitly, a Windows-only need (os_name == "nt"): harmless on Linux
        # and macOS, not worth regenerating the lock over. See .github/requirements/e2e.in.
        run: |
          python -m pip install --require-hashes -r .github/requirements/pip.txt
          python -m pip install --require-hashes -r .github/requirements/e2e.txt

      - name: Run cross-OS e2e wiring harness
        # conftest.py builds the wheel + clean venv internally; the outer env
        # only needs build + pytest.
        run: python -m pytest tests/e2e -v

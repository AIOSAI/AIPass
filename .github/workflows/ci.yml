name: CI

on:
  # push fires on main only (post-merge validation). Dev work is always PR'd
  # within minutes, so push+pull_request on dev double-ran every job — the PR
  # event alone carries the required checks.
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

# One run per ref at a time, and a RUNNING run is never cancelled: a new push
# queues behind it (GitHub keeps at most one pending run per group). Until
# 2026-09-08 this was cancel-in-progress: true, and eight landings pushed
# within hours on 2026-09-07/08 erased every in-flight verdict; the first
# completed matrix showed 13 reds with no wave to attribute them to
# (RPLAN-0004 in seedgo, finding 2.5). A verdict that finishes is worth the
# runner minutes it costs on a public repo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # Hash-pinned tool install (Scorecard: Pinned-Dependencies). Pins ruff to
      # the version this lint gate is known-green against; see .github/requirements/lint.in.
      - run: python -m pip install --require-hashes -r .github/requirements/lint.txt
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --require-hashes -r .github/requirements/pip.txt
          pip install -e ".[dev,host]"
      # tests/e2e build a wheel + clean venv per the dedicated e2e-wheel.yml
      # workflow — they are not part of the fast unit lane.
      # Plain pytest: this job's old `coverage run` wrapper produced data that
      # was never reported anywhere (the coverage job collects its own) — it
      # only slowed all four matrix legs.
      # xdist (DPLAN-0277 phase 1b): loadscope keeps each test class on one
      # worker. The suite's shared-state hygiene was fixed for this — see the
      # repo-root conftest.py guard — and proven over repeated full runs.
      # --timeout (pytest-timeout, a dev extra): one hung test used to take the
      # whole job to its 30-minute cap with no traceback — PR #774 round three,
      # run 38087470864, the 3.10 leg sat 26 min behind one api socket test and
      # the summary never printed. A per-test ceiling fails that one test with
      # the stack of where it sat; the slowest honest test here is under 2 min.
      # --timeout-method thread: the default signal method cannot interrupt a
      # wait inside C (a lock, a portal join), and round five's macOS leg hung
      # past its 300 s ceiling that way (run 38100884450, memory's search test
      # FAILED then its worker never reported again). The thread method dumps
      # every thread's stack and exits the worker; xdist marks the test failed
      # and carries on, so the job ends with evidence instead of a cancel.
      # --max-worker-restart 0: a worker that dies outright ("node down: Not
      # properly terminated") ends the session red with the in-flight test
      # named. Round five's macOS leg (run 38100884450) let xdist replace the
      # dead worker and the session never finished: 8 minutes of silence, then
      # the job cap, no summary. A dead worker is a red; say so in one line.
      - run: pytest -v --tb=short --rootdir=. --ignore=tests/e2e -n auto --dist loadscope --timeout 300 --timeout-method thread --max-worker-restart 0

  standards:
    name: seedgo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: stale_header_date (2026-09-25) reads `git log` for the
          # last commit touching each test file. A shallow (depth-1) checkout
          # makes every file look born at HEAD, so that checker DECLINES there
          # rather than guess. Full history makes CI match a local audit exactly.
          # (This once served a README-freshness check that no longer reads git.)
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --require-hashes -r .github/requirements/pip.txt
          # Install the `memory` extra (numpy/chromadb/fastembed) alongside dev:
          # the diagnostics standard runs pyright over every branch, and memory's
          # handlers import chromadb/numpy. Without these deps installed, pyright
          # reports them as unresolved imports (reportMissingImports=error) and
          # memory scores <100 — a false failure from a missing CI dep, not a code
          # defect. Installing the declared extra lets pyright resolve them so the
          # audit measures real type-correctness (and matches a local audit).
          pip install -e ".[dev,memory]"
      # Public repo: no developer's home path in any tracked text file (the owner,
      # 2026-10-04). Reads git ls-files; exit 1 on a hit, 2 when it could not measure.
      - name: No developer home path in tracked files
        run: python -m aipass.seedgo.apps.seedgo home-paths scan
      - name: Run seedgo standards audit
        run: python .github/scripts/seedgo_audit.py

  coverage:
    name: coverage
    # No `needs: [test]` — it re-runs the suite itself, so chaining it after
    # the matrix only serialized the two longest jobs (~13 min critical path).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --require-hashes -r .github/requirements/pip.txt
          pip install -e ".[dev,host]"
      - run: coverage run -m pytest --rootdir=. --ignore=tests/e2e --timeout 300 --timeout-method thread
      - run: coverage xml
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

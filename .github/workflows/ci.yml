name: CI

# Transition lane (the owner, 2026-11-08): AIPass is Linux only and PRs must
# land in minutes. This file runs lint alone. The full lane (pytest matrix,
# sentry-audit, coverage) sits beside it as ci.yml(full_disabled), unread by
# Actions; tests still run locally and on the daemon's schedule. Restore it by
# renaming back once the Linux-only structure settles.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # Hash-pinned tool install (Scorecard: Pinned-Dependencies); see .github/requirements/lint.in.
      - run: python -m pip install --require-hashes -r .github/requirements/lint.txt
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

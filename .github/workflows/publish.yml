name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Job-level permissions REPLACE the top-level block rather than merge with
    # it, so `contents: read` is restated here on purpose — dropping it would
    # break actions/checkout. id-token/attestations are what the provenance
    # attestation below needs (Scorecard: Signed-Releases).
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # Hash-pinned tool install (Scorecard: Pinned-Dependencies).
      - run: python -m pip install --require-hashes -r .github/requirements/build.txt
      - run: python -m build
      - name: Attest build provenance
        # Signs a provenance statement binding these exact sdist/wheel digests to
        # this workflow run, via the same keyless Sigstore/OIDC path as the
        # release signing below. Runs after the artifacts exist and before they
        # leave the job, so the attested digests are the published ones.
        # NOTE: the bundle is deliberately NOT written into dist/ — the publish
        # job feeds dist/* to gh-action-pypi-publish, which rejects any file that
        # is not a distribution. See the report note on attaching provenance to
        # the GitHub Release.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # keyless Sigstore signing (OIDC); no signing key exists
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Sign artifacts with Sigstore (keyless, OIDC)
        # Produces dist/<artifact>.sigstore.json bundles next to each wheel/sdist.
        # The 'gh release create dist/*' step below then attaches them to the
        # GitHub Release, which is where Scorecard's Signed-Releases check looks.
        # release-signing-artifacts is disabled: the action's own auto-attach only
        # fires on a 'release: published' event, but we trigger on 'push: tags',
        # so we upload the bundles ourselves via the dist/* glob.
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl
          release-signing-artifacts: false
      - name: Extract the tag's CHANGELOG section
        run: |
          # The block whose "## [...]" header names this tag, not the topmost one:
          # an [Unreleased] header above it shipped v2.8.20 with an empty body.
          # The tag must sit between non-version characters so v2.8.2 never
          # claims v2.8.20. No such block is an error, never an empty release.
          awk -v tag="$GITHUB_REF_NAME" \
            '/^## \[/{p = ($0 ~ ("(^|[^0-9A-Za-z.])" tag "([^0-9]|$)"))} p' \
            CHANGELOG.md | sed '/^---$/d' > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "no CHANGELOG.md section header carries $GITHUB_REF_NAME" >&2
            exit 1
          fi
          # GitHub refuses a release body over 125,000 characters (HTTP 422,
          # v2.8.11's block was 144,571). Cut on an entry boundary under the cap
          # and point at the full block; the CHANGELOG stays the record.
          python3 - "$GITHUB_REF_NAME" <<'EOF'
          import pathlib, sys
          tag = sys.argv[1]
          p = pathlib.Path("release_notes.md")
          full = p.read_text()
          cap = 120_000
          if len(full) > cap:
              head = full.splitlines()[0]
              tail = (
                  "\n\n---\n\n*Release notes truncated: the full block is "
                  f"{len(full):,} characters and GitHub caps a release body at 125,000. "
                  f"The complete entry is `{head[:60]}…` in "
                  f"[CHANGELOG.md](https://github.com/${{ github.repository }}/blob/{tag}/CHANGELOG.md).*\n"
              )
              cut = full.rfind("\n- **", 0, cap - len(tail))
              if cut <= 0:
                  cut = cap - len(tail)
              p.write_text(full[:cut].rstrip() + tail)
              print(f"release notes truncated: {len(full):,} -> {len(p.read_text()):,} chars")
          EOF
          echo "Release notes:" && cat release_notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release_notes.md \
            dist/*

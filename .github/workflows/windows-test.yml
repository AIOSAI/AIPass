name: Windows Test

on:
  workflow_dispatch:
  # Runs on every PR (required check) + push to main (post-merge validation).
  # NOT path-filtered: a path filter makes a required check skip on unrelated
  # PRs, which GitHub parks as "Expected — waiting for status" forever,
  # blocking the merge. Dev-push was dropped 2026-08-01: dev work is PR'd
  # within minutes, so push+PR double-ran every job for nothing.
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

# One run per ref at a time; a RUNNING run is never cancelled, a new push
# queues behind it. Was cancel-in-progress: true until 2026-09-08, which erased
# every Windows verdict across eight rapid landings (RPLAN-0004, finding 2.5).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows-setup:
    runs-on: windows-latest
    # A healthy run is ~9 minutes. Without this bound a hung test burns the
    # runner for GitHub's 6h default — 2026-08-18 sat 1h57m until a push
    # cancelled it (commons concurrent probe, os.replace sharing violation).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Run setup.sh
        shell: bash
        run: bash setup.sh

      - name: Verify drone CLI
        shell: bash
        run: |
          source .venv/Scripts/activate
          export PYTHONUTF8=1
          drone --version
          drone systems
          drone @seedgo --help

      - name: Run full test suite
        shell: bash
        run: |
          source .venv/Scripts/activate
          export PYTHONUTF8=1
          # pipefail: the pipe returns pytest's status, not tee's. shell: bash
          # above already implies -eo pipefail on GitHub runners, so this job
          # failed honestly before; the line is explicit so the two OS jobs read
          # the same and nobody removes the shell key thinking it is cosmetic.
          set -o pipefail
          pytest -v --tb=short --rootdir=. -n auto --dist loadscope 2>&1 | tee pytest-output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-pytest-results
          path: pytest-output.txt

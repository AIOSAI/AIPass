name: macOS Test

on:
  workflow_dispatch:
  # Runs on every PR (required check) + push to main (post-merge validation).
  # NOT path-filtered: a path filter makes a required check skip on unrelated
  # PRs, which GitHub parks as "Expected — waiting for status" forever,
  # blocking the merge. Dev-push was dropped 2026-08-01: dev work is PR'd
  # within minutes, so push+PR double-ran every job for nothing.
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

# A new push to the same ref cancels the stale in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos-setup:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Run setup.sh
        run: bash setup.sh

      - name: Verify drone CLI
        run: |
          source .venv/bin/activate
          drone --version
          drone systems
          drone @seedgo --help

      - name: Run full test suite
        run: |
          source .venv/bin/activate
          pytest -v --tb=short --rootdir=. 2>&1 | tee pytest-output.txt
          echo "EXIT_CODE=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-pytest-results
          path: pytest-output.txt

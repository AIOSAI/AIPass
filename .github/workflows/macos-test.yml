name: macOS Test

on:
  workflow_dispatch:
  # Runs on every PR (required check) + push to main (post-merge validation).
  # NOT path-filtered: a path filter makes a required check skip on unrelated
  # PRs, which GitHub parks as "Expected — waiting for status" forever,
  # blocking the merge. Dev-push was dropped 2026-08-01: dev work is PR'd
  # within minutes, so push+PR double-ran every job for nothing.
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

# One run per ref at a time; a RUNNING run is never cancelled, a new push
# queues behind it. Was cancel-in-progress: true until 2026-09-08, which erased
# every macOS verdict across eight rapid landings (RPLAN-0004, finding 2.5).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  macos-setup:
    runs-on: macos-latest
    # Healthy run ~5m; bound so a hang fails fast instead of holding the runner.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Run setup.sh
        run: bash setup.sh

      - name: Verify drone CLI
        run: |
          source .venv/bin/activate
          drone --version
          drone systems
          drone @seedgo --help

      - name: Run full test suite
        run: |
          source .venv/bin/activate
          # pipefail: the pipe returns pytest's status, not tee's. Without it
          # this job could not fail on test failures (32 failed on the v2.8.6
          # merge, job green; @verify c89af1b3, 2026-09-11). The step's own
          # non-zero exit is the gate; upload below still runs on if: always().
          set -o pipefail
          # --timeout: a per-test ceiling (pytest-timeout, installed by setup.sh's
          # dev extra); see ci.yml's test job for the hang that made it necessary.
          # --timeout-method thread + --max-worker-restart 0: see ci.yml's test
          # job. This lane is where the dead worker hung the job (PR #774 round
          # five, run 38100884450, 3 workers, gw2 "Not properly terminated").
          pytest -v --tb=short --rootdir=. -n auto --dist loadscope --timeout 300 --timeout-method thread --max-worker-restart 0 2>&1 | tee pytest-output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-pytest-results
          path: pytest-output.txt
